# Crea un servicio de pago con disco persistente. Revisa el coste en Render antes de aplicarlo.
services:
  - type: web
    name: ticketerasolicitudes
    runtime: python
    plan: 1c-2g
    numInstances: 1
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor.py
    healthCheckPath: /_stcore/health
    disk:
      name: datos-ticketera
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: RUTA_DB
        value: /var/data/plataforma.db
      - key: PORTAL_CLOUD
        value: "1"
      - key: SETUP_TOKEN
        generateValue: true
      - key: CORREO_MODO
        value: desactivado
      - key: BUZON_ATENCION
        value: adiv.puente@goexpertis.com
