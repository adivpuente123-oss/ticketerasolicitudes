# Plan gratuito: los datos viven en Supabase, nunca en el disco temporal de Render.
services:
  - type: web
    name: ticketerasolicitudes
    runtime: python
    plan: free
    numInstances: 1
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: expedientes
      - key: EXIGIR_DB_REMOTA
        value: "1"
      - key: PORTAL_CLOUD
        value: "1"
      - key: SETUP_TOKEN
        generateValue: true
      - key: CORREO_MODO
        value: desactivado
      - key: BUZON_ATENCION
        value: adiv.puente@goexpertis.com
